services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: brain-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@brain.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: brain-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Port not exposed — brain connects internally via service name "ollama"

  ollama-init:
    image: ollama/ollama:latest
    container_name: brain-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: on-failure

  brain:
    build: .
    container_name: brain-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://brain:brain@postgres:5432/brain
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      EMBEDDER_BACKEND: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: nomic-embed-text
    ports:
      - "8000:8000"

volumes:
  pgdata:
  ollama_data:
