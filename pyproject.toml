[project]
name = "brain"
version = "0.1.0"
description = "AI vector brain — local semantic memory via MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=1.24",
    "ollama>=0.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.9",
    "httpx>=0.27",
    "langchain-text-splitters>=0.3",
    "python-dotenv>=1.0",
    "openai>=2.26.0",
    "sqlite-vec>=0.1.6",
    "huggingface-hub>=1.6.0",
]

[project.optional-dependencies]
# macOS-only backends — not available on Linux containers
macos = [
    "mlx-embeddings>=0.0.5",
    "pyobjc-framework-naturallanguage>=12.1",
    "numbers-parser>=4.0",
]

[project.scripts]
brain = "brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]
